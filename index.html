<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- `color-scheme` le dice al navegador que pinte sus propios controles y
         el fondo del lienzo en el tema correcto: sin esto, el modo oscuro deja
         barras de scroll y campos nativos en blanco sobre la interfaz oscura. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1B2A4A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080f1c" media="(prefers-color-scheme: dark)" />
    
    <!-- Esto es una plataforma interna: no debe aparecer en buscadores.
         `robots.txt` por si solo NO alcanza — bloquea el rastreo, no la
         indexacion, y una URL enlazada desde fuera puede figurar igual. Por eso
         el rastreo se permite y se responde `noindex`: es la unica forma de que
         un buscador lea la directiva y la obedezca. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Primary Meta Tags -->
    <title>Gestión Ruth | Plataforma Interna</title>
    <meta name="title" content="Gestión Ruth | Plataforma Interna" />
    <meta name="description" content="Plataforma interna de la Escuela de Lenguaje Ruth para permisos del personal, solicitudes de materiales, matrícula y seguimiento fonoaudiológico." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gestión Ruth | Plataforma Interna" />
    <meta property="og:description" content="Plataforma interna de gestión para la Escuela de Lenguaje Ruth." />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:url" content="https://sige-ruth.vercel.app/" />
    <meta property="og:image" content="https://sige-ruth.vercel.app/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="Gestión Ruth | Plataforma Interna" />
    <meta property="twitter:description" content="Plataforma interna de gestión para la Escuela de Lenguaje Ruth." />
    <meta property="twitter:image" content="https://sige-ruth.vercel.app/pwa-512x512.png" />

    <!-- Performance & Security -->
    <link rel="canonical" href="https://sige-ruth.vercel.app/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://iltrnhrmshsjfwokcpia.supabase.co" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    
    <!-- Fuentes.
         Se descargaba Inter (6 pesos) y Outfit (5) desde acá, mas Plus Jakarta
         Sans por un `@import` dentro del CSS. De las tres, la unica que la hoja
         de estilos usa es Plus Jakarta Sans; Outfit no aparecia en ninguna
         regla. Y el `@import` es lo peor de todo: el navegador no sabe que esa
         fuente existe hasta que termina de bajar y parsear el CSS, asi que la
         pide en serie en vez de en paralelo.
         Queda una familia, pedida desde el <head>. Inter sigue en la pila de
         respaldo: si esta instalada localmente se usa, pero no se descarga. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- PWA & Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23D4A853'/><text x='50%25' y='55%25' font-family='Arial' font-size='20' font-weight='bold' fill='%231B2A4A' text-anchor='middle' dominant-baseline='middle'>R</text></svg>" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
