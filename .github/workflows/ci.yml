# =============================================================================
# CI — lo mínimo que nadie debería tener que acordarse de correr a mano.
#
# Existe por un caso concreto: se publicó un package.json sin regenerar el
# lockfile. `npm ci` local lo toleró y el fallo habría aparecido recién en el
# despliegue. El paso `npm ci` de acá lo detecta antes de que llegue a main.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo cancela la corrida anterior de la misma rama: no tiene sentido
# esperar el resultado de un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tipos y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` falla si package.json y package-lock.json no coinciden.
      # Ese es medio punto del trabajo de este job.
      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run type-check

      - name: Pruebas unitarias
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Dependencias de runtime
        run: npm audit --omit=dev

      - name: Detectar secretos versionados
        run: npm run security:secrets

      - name: Verificar privacidad y migraciones
        run: npm run security:privacy

      # Compila en Linux, que distingue mayúsculas — a diferencia de Windows.
      # Un import con la caja equivocada revienta acá y no en producción.
      - name: Compilar
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ejemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  database:
    name: Esquema reproducible y RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Levantar desde cero demuestra que el baseline y todas las migraciones
      # son reproducibles, sin tocar una base remota ni usar secretos.
      - name: Reconstruir Supabase local
        run: supabase db start

      - name: Correr pruebas de reglas
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:rls

      - name: Detener Supabase local
        if: always()
        run: supabase stop --no-backup
